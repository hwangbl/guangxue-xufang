name: Import web assets
on:
  push:
    branches: [main]
    paths: ['.publish/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and unpack website
        run: |
          cat .publish/site.tar.gz.part* > "$RUNNER_TEMP/site.tar.gz"
          printf '%s  %s\n' '1d3584622b8b204d7579fce0b8f5e50a9c2786ebcc80f6f349796b1bf7c4e5c9' "$RUNNER_TEMP/site.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/site.tar.gz"
          test -f index.html
          test -f .nojekyll
          test "$(find labs -name '*.glb' | wc -l)" -eq 17
          cp -a .publish/overlay/. .
          rm -rf .publish
          rm .github/workflows/import-web.yml
      - name: Save published web files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare optical experiments for GitHub Pages"
          git push origin HEAD:main
